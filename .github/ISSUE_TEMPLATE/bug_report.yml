name: Bug report
description: Report a reproducible defect that does not contain sensitive information
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, account data, private keys, or exploitable security details. Follow SECURITY.md for sensitive reports.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest paper-mode or replay reproduction.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Commit SHA where the issue occurs.

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Paper
        - Backtest
        - Demo without credentials
        - Live (do not include account details)
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Include relevant sanitized logs and test output.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, account identifiers, positions, and private data.
          required: true
